<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Swearingen - Portfolio</title>

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon/favicon-16x16.png">
    <link rel="manifest" href="./favicon/site.webmanifest">
    <meta name="theme-color" content="#1a1a2e">

    <!-- Styles -->
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/ui.css">
</head>
<body>
    <!-- Three.js Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-content">
            <h1>Alex Swearingen</h1>
            <p class="loading-subtitle">Software Engineer</p>
            <div class="loading-progress">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <p class="loading-text" id="loading-text">Loading...</p>
            <p class="instructions">Use WASD to move, E to interact</p>
            <button type="button" id="start-button" class="hidden">Click to Enter</button>
            <button type="button" id="skip-to-resume" class="skip-button">Skip to Resume</button>
        </div>
    </div>

    <!-- Interaction Prompt -->
    <div id="interaction-prompt" class="hidden">
        Press E to interact
    </div>

    <!-- Modal -->
    <div id="modal-overlay" class="hidden">
        <div id="modal">
            <button type="button" id="modal-close" aria-label="Close modal">&times;</button>
            <h2 id="modal-title">Title</h2>
            <h3 id="modal-subtitle">Subtitle</h3>
            <p id="modal-dates"></p>
            <p id="modal-description"></p>
            <ul id="modal-achievements"></ul>
        </div>
    </div>

    <!-- Resume Section (hidden by default) -->
    <div id="resume-section" class="hidden">
        <!-- Will be populated by content.js -->
    </div>

    <!-- Minimap -->
    <canvas id="minimap" width="150" height="150"></canvas>

    <!-- Audio Toggle -->
    <button type="button" id="audio-toggle" class="hidden" aria-label="Toggle audio">
        <span class="audio-icon">&#128266;</span>
    </button>

    <!-- Three.js r160 from CDN -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <!-- Application Scripts -->
    <script type="module" src="./js/data/content.js"></script>
    <script type="module" src="./js/core/constants.js"></script>
    <script type="module" src="./js/core/materials.js"></script>
    <script type="module" src="./js/core/engine.js"></script>
    <script type="module" src="./js/core/loop.js"></script>
    <script type="module" src="./js/entities/garage.js"></script>
    <script type="module" src="./js/entities/robot.js"></script>
    <script type="module" src="./js/entities/station.js"></script>
    <script type="module" src="./js/systems/controls.js"></script>
    <script type="module" src="./js/systems/collision.js"></script>
    <script type="module" src="./js/systems/ui.js"></script>
    <script type="module" src="./js/systems/audio.js"></script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
